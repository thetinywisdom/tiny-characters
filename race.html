<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Tiny Race</title>
    <style>
      html, body { margin: 0; height: 100%; background: #20242c; overflow: hidden; overscroll-behavior: none; }
      #race { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; image-rendering: pixelated; touch-action: none; }
      /* touch buttons (only on touch screens): steer on the left, gas and brake on the right */
      .pad { position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); display: none; gap: 12px; z-index: 2; }
      .pad.left { left: max(14px, env(safe-area-inset-left)); }
      .pad.right { right: max(14px, env(safe-area-inset-right)); }
      body.touch .pad { display: flex; }
      .pad button { width: 72px; height: 72px; border: 0; border-radius: 0; background: rgba(24, 28, 36, 0.55); color: #f2f2ee;
        font: 700 28px monospace; touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: inset 0 0 0 3px rgba(242, 242, 238, 0.25); }
      .pad button.on { background: rgba(242, 194, 48, 0.75); color: #2a2d32; }
      .top { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 2; }
      @media (max-width: 600px) { .top .wide { display: none; } }
      @media (min-width: 601px) { .top .narrow { display: none; } }
      .top a, .top button { font: 400 13px monospace; color: #f2f2ee; background: rgba(24, 28, 36, 0.6); border: 0; padding: 6px 10px; text-decoration: none; cursor: pointer; }
    </style>
  </head>
  <body>
    <canvas id="race" aria-label="A car race on a circuit in the fields"></canvas>
    <div class="top"><a href="./index.html" aria-label="Back to the town"><span class="wide">← Town</span><span class="narrow">←</span></a><button type="button" id="full" aria-label="Full screen"><span class="wide">Full screen</span><span class="narrow">⛶</span></button></div>
    <div class="pad left"><button type="button" data-key="left" aria-label="Steer left">◀</button><button type="button" data-key="right" aria-label="Steer right">▶</button></div>
    <div class="pad right"><button type="button" data-key="down" aria-label="Brake">▼</button><button type="button" data-key="up" aria-label="Accelerate">▲</button></div>
    <script type="module" src="./demo/race.js"></script>
  </body>
</html>
